name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: Verbose npm logs
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Smoke test
        run: |
          node bin/cli.js --all --en
          node bin/cli.js --all --tr

      - name: Publish new versions
        run: npm run publish:all
        env:
          NPM_CONFIG_LOGLEVEL: ${{ inputs.debug && 'verbose' || 'notice' }}
