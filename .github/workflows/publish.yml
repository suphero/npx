name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Smoke test
        run: |
          node bin/cli.js --all --en
          node bin/cli.js --all --tr

      - name: Publish new versions
        run: npm run publish:all
